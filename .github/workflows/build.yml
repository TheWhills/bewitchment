# Forge build for the port. On every push it runs the full build and publishes the
# log to the `ci-logs` branch (build.log, errors.txt, status.txt) so results can be
# read with plain git: `git fetch origin ci-logs && git show origin/ci-logs:status.txt`.
# The built jar is attached to the run as an artifact when the build succeeds.

name: build
on:
  push:
    branches: [forge-port]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew build --stacktrace --console=plain 2>&1 | tee build.log
      - name: summarize
        if: always()
        run: |
          grep -E '^/.*\.java:[0-9]+: error:' build.log | sed "s|$GITHUB_WORKSPACE/||" > errors.txt || true
          {
            echo "commit: ${GITHUB_SHA::7}"
            echo "result: ${{ steps.build.outcome }}"
            echo "java errors: $(wc -l < errors.txt)"
            echo "files with errors: $(cut -d: -f1 errors.txt | sort -u | wc -l)"
          } > status.txt
          cat status.txt
      - name: publish log to ci-logs
        if: always()
        run: |
          mkdir -p /tmp/out && mv build.log errors.txt status.txt /tmp/out/
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git fetch origin ci-logs && git checkout -q -B ci-logs origin/ci-logs || git checkout -q --orphan ci-logs
          git rm -rq --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/out/* .
          git add build.log errors.txt status.txt
          git commit -qm "build ${GITHUB_SHA::7}: ${{ steps.build.outcome }}"
          git push -q origin ci-logs
      - name: upload jar
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: bewitchment-forge
          path: build/libs/
      - name: fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
