# Forge build for the port. On every push it runs the full build and publishes the
# log to the `ci-logs` branch (build.log, errors.txt, status.txt) so results can be
# read with plain git: `git fetch origin ci-logs && git show origin/ci-logs:status.txt`.
# The built jar is attached to the run as an artifact when the build succeeds.

name: build
on:
  push:
    branches: [forge-port]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: build
        id: build
        continue-on-error: true
        # A stalled dependency download once hung configuration for 35+ minutes; fail fast and still publish the log.
        timeout-minutes: 25
        run: |
          set -o pipefail
          ./gradlew build --stacktrace --console=plain 2>&1 | tee build.log
      - name: gametest server
        id: gametest
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -o pipefail
          ./gradlew runGameTestServer --console=plain 2>&1 | tee gametest.log
          # The task can exit 0 even when the server never started; require the GameTest verdict line.
          grep -q "required tests passed" gametest.log
          # Data problems (recipes, tags, loot, biome modifiers) only log and carry on; treat them as failures.
          if grep -E "(Could not decode|Couldn't parse|Couldn't load|Parsing error|Failed to load|Unknown type).*bewitchment" gametest.log; then exit 1; fi
      - name: client smoke test
        id: client
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -o pipefail
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient -PclientSmokeTest --console=plain 2>&1 | tee client.log
          grep -q "BEWITCHMENT CLIENT SMOKE TEST PASSED" client.log
          if grep -E "Mixin apply failed|InvalidInjectionException|Critical injection failure" client.log; then exit 1; fi
      - name: summarize
        if: always()
        run: |
          grep -E '^/.*\.java:[0-9]+: error:' build.log | sed "s|$GITHUB_WORKSPACE/||" > errors.txt || true
          {
            echo "commit: ${GITHUB_SHA::7}"
            echo "result: ${{ steps.build.outcome }}"
            echo "java errors: $(wc -l < errors.txt)"
            echo "files with errors: $(cut -d: -f1 errors.txt | sort -u | wc -l)"
            echo "gametests: ${{ steps.gametest.outcome || 'skipped' }}"
            echo "client smoke test: ${{ steps.client.outcome || 'skipped' }}"
            if [ -f gametest.log ]; then
              echo "gametest summary: $(grep -E 'required tests (passed|failed)|GAME TESTS COMPLETE|Failed to start the minecraft server' gametest.log | sed -E 's/^\[[^]]*\] \[[^]]*\] \[[^]]*\]: //' | tail -3 | tr '\n' ' ')"
            fi
          } > status.txt
          cat status.txt
      - name: upload jar
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: bewitchment-forge
          path: build/libs/
      - name: publish log to ci-logs
        if: always()
        run: |
          mkdir -p /tmp/out && mv build.log errors.txt status.txt /tmp/out/ && { [ -f gametest.log ] && mv gametest.log /tmp/out/ || true; } && { [ -f client.log ] && mv client.log /tmp/out/ || true; } && { [ -f run/logs/latest.log ] && cp run/logs/latest.log /tmp/out/server-latest.log || true; }
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git fetch origin ci-logs && git checkout -q -B ci-logs origin/ci-logs || git checkout -q --orphan ci-logs
          git rm -rq --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/out/* .
          git add build.log errors.txt status.txt $(ls gametest.log server-latest.log client.log 2>/dev/null)
          git commit -qm "build ${GITHUB_SHA::7}: ${{ steps.build.outcome }}"
          git push -q origin ci-logs
      - name: fail if build or gametests failed
        if: steps.build.outcome != 'success' || steps.gametest.outcome == 'failure' || steps.client.outcome == 'failure'
        run: exit 1
