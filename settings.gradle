pluginManagement {
	repositories {
		gradlePluginPortal()
		maven {
			name = 'MinecraftForge'
			url = 'https://maven.minecraftforge.net/'
		}
		maven {
			name = 'Parchment'
			url = 'https://maven.parchmentmc.org'
		}
		maven {
			name = 'Sponge'
			url = 'https://repo.spongepowered.org/repositories/maven-public/'
		}
	}
}

plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'bewitchment'
